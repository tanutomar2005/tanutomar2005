<rect x="112" y="178" width="111" height="30" rx="15" fill="#0A1020" stroke="#3857A0"/><text x="167.5" y="198" text-anchor="middle" fill="#D6E2FF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">JavaScript</text>
<rect x="231" y="178" width="71" height="30" rx="15" fill="#0A1020" stroke="#3857A0"/><text x="266.5" y="198" text-anchor="middle" fill="#D6E2FF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">Vite</text>
