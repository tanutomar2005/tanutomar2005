<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-labelledby="title desc">
<title id="title">TenderX project card</title>
<desc id="desc">AI-assisted public procurement workflows for tender publishing, bid evaluation, and accountable decisions. Stack: Python, FastAPI, React, Docker.</desc>
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111025"/><stop offset="1" stop-color="#03050B"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#8B5CF6"/><stop offset="1" stop-color="#5B8CFF"/></linearGradient>
  <filter id="glow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="638" height="248" rx="17" fill="url(#card)" stroke="#3A2C61" stroke-width="1.5"/>
<rect x="2" y="2" width="636" height="4" rx="2" fill="url(#accent)"/>
<circle cx="31" cy="39" r="5" fill="#8B5CF6" filter="url(#glow)"/>
<text x="48" y="47" fill="#F6F8FF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700">TenderX</text>
<path d="M28 66H612" stroke="#3A2C61" stroke-width="1"/>
<text x="28" y="99" fill="#C7D3E7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">AI-assisted public procurement workflows for tender</text>
<text x="28" y="122" fill="#C7D3E7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">publishing, bid evaluation, and accountable decisions.</text>
<text x="28" y="164" fill="#B99AFF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1">STACK</text>
