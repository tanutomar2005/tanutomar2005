<rect x="303" y="178" width="82" height="30" rx="15" fill="#0B0A19" stroke="#59418D"/><text x="344" y="198" text-anchor="middle" fill="#E1D6FF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">Docker</text>
