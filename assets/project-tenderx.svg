<rect x="119" y="178" width="94" height="30" rx="15" fill="#0B0A19" stroke="#59418D"/><text x="166" y="198" text-anchor="middle" fill="#E1D6FF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">FastAPI</text>
