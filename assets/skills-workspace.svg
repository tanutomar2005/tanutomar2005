<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">My Skills - Skills That Build My Future</title>
<desc id="desc">A futuristic laptop workspace connected to Python, React, JavaScript, HTML, CSS, Git, GitHub, DSA, VS Code, and MySQL skill nodes.</desc>
<defs>
  <linearGradient id="frame" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#00E5FF"/>
    <stop offset=".48" stop-color="#4678FF"/>
    <stop offset="1" stop-color="#8B5CF6"/>
    <animate attributeName="x1" values="0;700;0" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1000;1700;1000" dur="18s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="screen-edge" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#00E5FF" stop-opacity=".8"/>
    <stop offset="1" stop-color="#8B5CF6" stop-opacity=".65"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect x="2" y="2" width="996" height="336" rx="18" fill="#050914" stroke="url(#frame)" stroke-width="2"/>
<rect x="10" y="10" width="980" height="320" rx="13" fill="none" stroke="#172342"/>
<path d="M30 66h940" stroke="#172342"/>
<text x="500" y="44" text-anchor="middle" fill="#E8F2FF" font-family="Consolas,monospace" font-size="19" font-weight="700">Skills That Build My Future ♡</text>
<circle cx="34" cy="39" r="3" fill="#00E5FF" filter="url(#glow)">
  <animate attributeName="opacity" values=".35;1;.35" dur="3.2s" repeatCount="indefinite"/>
</circle>
<circle cx="966" cy="39" r="3" fill="#8B5CF6" filter="url(#glow)">
  <animate attributeName="opacity" values="1;.3;1" dur="3.8s" repeatCount="indefinite"/>
</circle>

